[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "a7r-formats"
version = "0.1.0"
description = "Research tools for extra aspect ratios on the Sony ILCE-7R"
requires-python = ">=3.11"
dependencies = ["pyelftools"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["firmware: needs a locally unpacked firmware in fw/out (skipped otherwise)"]

[tool.setuptools]
packages = ["a7r"]
